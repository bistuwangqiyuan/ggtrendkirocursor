[build]
  command = "pnpm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"
  # Bundle pg (and its runtime deps pg-types/pg-pool/pg-protocol/...) INTO each
  # function. Only the optional native binding pg-native stays external — its
  # dynamic require is what esbuild can't resolve, and pg falls back to the
  # pure-JS client when the module is absent.
  #
  # Do NOT mark pg itself external: an external pg still require()s pg-types &
  # co. at runtime, and those packages don't ship with the function bundle.
  # That exact misconfiguration crashed bp-batch-background at module init
  # ("Cannot find module 'pg-types'") on every scheduled run from 2026-07-04
  # to 2026-07-13 and silently halted all BP generation.
  external_node_modules = ["pg-native"]

# Give the SSR/API function the maximum synchronous timeout so LLM-backed BP
# generation has the best chance to finish before Netlify cuts the request.
# Scoped to the Astro SSR function only — a wildcard would also constrain
# bp-batch-background, which relies on the 15-minute background budget.
[functions."ssr"]
  timeout = 26

[build.environment]
  NODE_VERSION = "20"

# Baseline security headers for every response.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
