[build]
  command = "pnpm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"
  included_files = ["node_modules/pg/**"]
  # pg ships an optional native binding (pg-native) behind a dynamic require
  # that esbuild cannot resolve; keep pg external (its files are shipped via
  # included_files above) so bp-batch-background can import the DB client.
  external_node_modules = ["pg", "pg-native"]

# Give the SSR/API function the maximum synchronous timeout so LLM-backed BP
# generation has the best chance to finish before Netlify cuts the request.
# Scoped to the Astro SSR function only — a wildcard would also constrain
# bp-batch-background, which relies on the 15-minute background budget.
[functions."ssr"]
  timeout = 26

[build.environment]
  NODE_VERSION = "20"

# Baseline security headers for every response.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
